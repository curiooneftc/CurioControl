# --- Gradle -------------------------------------------------------------------
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# --- Warnings -----------------------------------------------------------------
# Treat deprecations as errors in CI so we notice them before the FTC SDK moves on.
org.gradle.warning.mode=summary

# --- CurioControl -------------------------------------------------------------
# Fully-qualified Maven coordinates, also mirrored in CurioConfig.VERSION.
curio.group=org.curioone
curio.artifact=curiocontrol

# GitHub Packages target. Override locally if you publish to a fork.
curio.packagesUrl=https://maven.pkg.github.com/curiooneftc/CurioControl
