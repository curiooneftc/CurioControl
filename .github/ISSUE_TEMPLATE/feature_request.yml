name: Feature request
description: Propose a capability for CurioControl
labels: [enhancement, needs-triage]

body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, check [`PHASES.md`](https://github.com/curiooneftc/CurioControl/blob/main/PHASES.md).
        Anything in the post-1.0 backlog is already planned; open an issue there to argue for
        moving it earlier rather than proposing it fresh.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        Describe the situation, not the solution. The best requests make the current workaround
        obvious.
      placeholder: |
        Every season we hand-write the same trapezoidal profile for our lift, with the timing
        constants copy-pasted between OpModes.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A sketch of the API you have in mind, if you have one.
      render: java
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Existing approaches, even imperfect ones.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Which package would this live in?
      options:
        - core
        - hardware
        - control
        - math
        - util
        - drive
        - command
        - telemetry
        - vision
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: fit
    attributes:
      label: Fit with the design
      description: |
        These are the design principles from spec.md section 43. A proposal that fights them is
        still worth opening — say so, and explain why the trade-off is worth it.
      options:
        - label: This keeps the framework simple
        - label: This keeps pure logic testable without hardware
        - label: This stays lightweight enough for Robot Controller hardware
        - label: This does not force the dependency on teams that would not use it
        - label: I am not sure yet
