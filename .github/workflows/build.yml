name: build

# Validation for every pull request and every push to a long-lived branch.
# A pull request is not mergeable if the library does not compile or its tests fail (spec.md 33).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One build per ref; a newer push supersedes an in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        # `build` covers compileJava, test, checkstyleMain/Test, spotbugsMain/Test,
        # spotlessCheck, and javadoc. A Develocity key is optional: the build never fails
        # for lack of one, so fork pull requests are safe.
        #
        # settings.gradle.kts already publishes a Build Scan on failure, and prints its URL
        # to the log. No extra scan step is needed here — running one would publish a
        # second, duplicate scan.
        run: ./gradlew build --stacktrace

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report-${{ github.run_id }}
          path: build/reports/jacoco/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: build/test-results/test/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Checkstyle report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-${{ github.run_id }}
          path: build/reports/checkstyle/
          retention-days: 7
          if-no-files-found: warn

  verify-example:
    name: Verify the example project compiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The example depends on a published artifact, so it can only be checked once a release
    # exists. See PHASES.md M1.6.
    if: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the example against the published artifact
        working-directory: examples/robot
        run: ./gradlew assembleDebug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
