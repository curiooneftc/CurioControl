name: release

# Publishing is manual-approved and runs only from an annotated version tag on main.
# A tag alone is not permission to publish: PUBLISH_ENABLED must also be set to "true"
# as a repository variable. Until then this workflow verifies and produces the artifacts
# without uploading them, which is the Phase 0 dry run (PHASES.md task 0.8).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Verify only; do not publish'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the changelog and version metadata are accurate.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify from a clean state
        # Deliberately not trusting the build cache for a release.
        # settings.gradle.kts publishes a Build Scan if this fails, and prints the URL.
        run: ./gradlew clean build --stacktrace

      - name: Check tag matches project version
        # GitHub Packages rejects republishing an existing GAV with 409 Conflict,
        # so a tag whose version does not match build.gradle.kts either republishes
        # the old artifact (409) or publishes under the wrong version. Fail fast
        # with a clear message instead of an obscure PUT 409.
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')"
          echo "tag version: $TAG_VERSION"
          echo "project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION} in build.gradle.kts. Bump 'version' to ${TAG_VERSION} before tagging."
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push'
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble artifacts for a dry run
        if: vars.PUBLISH_ENABLED != 'true' || github.event_name == 'workflow_dispatch'
        run: ./gradlew assemble

      - name: Create GitHub Release
        if: vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            build/libs/*.pom
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            See `CHANGELOG.md` for the full list of changes and
            `docs/reference/compatibility.md` for the toolchain matrix.

            CurioControl is pre-1.0. Pin an exact version; the API may change between
            minor releases.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (dry run only)
        if: always() && (vars.PUBLISH_ENABLED != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: build/libs/
          retention-days: 30
          if-no-files-found: error
