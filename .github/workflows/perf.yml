name: perf

# Scheduled allocation and timing benchmarks for the hot paths (spec.md 45).
#
# Kept off the pull request path on purpose: benchmarks are slow, and a regression should be
# reviewed deliberately rather than blocking a merge. The workflow reports; it does not fail the
# build. See PHASES.md M2.6.
on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: JMH benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run benchmarks
        # The benchmark module is introduced in Phase 2. Until then this step is a no-op and
        # the workflow exists so the schedule and the artifact contract are already in place.
        run: ./gradlew :benchmark:jmh --no-daemon || echo "benchmark module not present yet"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results-${{ github.run_id }}
          path: benchmark/build/results/
          retention-days: 30
          if-no-files-found: ignore
