name: perf

# Scheduled allocation and timing benchmarks for the hot paths (spec.md 45).
#
# Kept off the pull request path on purpose: benchmarks are slow, and a regression should be
# reviewed deliberately rather than blocking a merge. The workflow reports; it does not fail the
# build. See PHASES.md M2.6.
on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: JMH benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run benchmarks
        # Benchmarks live in src/jmh (a source set of the root project, not a separate
        # module: that keeps the FTC SDK classpath wiring and the test fakes in one place).
        # The run reports; it does not fail the build — a regression is reviewed deliberately.
        run: ./gradlew jmh --no-daemon

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results-${{ github.run_id }}
          path: build/results/jmh/
          retention-days: 30
          if-no-files-found: ignore
