[versions]
# --- Toolchain ---
java = "17"
# --- FTC SDK (compileOnly: provided by the Robot Controller app at runtime) ---
ftcSdk = "12.0.0"
androidxAnnotation = "1.9.1"
# The SDK's SerialNumber class carries a Gson annotation. Without gson on the compile classpath
# javac emits a classfile-lint warning that -Werror turns into a build failure. Declaring the
# real dependency is better than suppressing the lint category, which would hide genuine classpath
# gaps. compileOnly: the Robot Controller provides it at runtime.
gson = "2.14.0"
# EasyOpenCV carries org.opencv.core.Point, which appears in AprilTagSingleDetection's
# constructor. Tests build detections through that constructor (passing nulls for the untouched
# image fields), so javac needs the class even though no benchmark or test ever touches pixels.
easyopencv = "1.7.3"
# The OpenCV classes themselves, which EasyOpenCV depends on rather than bundles.
opencv = "4.10.0-A"
# --- Libraries ---
junit = "5.11.4"
mockito = "5.24.0"
archunit = "1.5.1"
# --- Plugins ---
spotbugsPlugin = "6.5.12"
spotless = "8.10.3"
develocity = "4.6.0"
foojayResolver = "1.0.0"
# JMH benchmarks (benchmark harness). Pinned; the plugin brings its own JMH libraries.
jmhPlugin = "0.7.2"

[libraries]
# FTC SDK modules — compileOnly only. See ADR-001.
ftc-robotcore = { module = "org.firstinspires.ftc:RobotCore", version.ref = "ftcSdk" }
ftc-hardware = { module = "org.firstinspires.ftc:Hardware", version.ref = "ftcSdk" }
ftc-vision = { module = "org.firstinspires.ftc:Vision", version.ref = "ftcSdk" }
ftc-inspection = { module = "org.firstinspires.ftc:Inspection", version.ref = "ftcSdk" }
ftc-ftccommon = { module = "org.firstinspires.ftc:FtcCommon", version.ref = "ftcSdk" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
easyopencv = { module = "org.openftc:easyopencv", version.ref = "easyopencv" }
opencv = { module = "org.openftc:opencv-repackaged-bundled-dylibs", version.ref = "opencv" }

# Test
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
develocity = { id = "com.gradle.develocity", version.ref = "develocity" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhPlugin" }
